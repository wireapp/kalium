name: Setup Java and Gradle
description: Set up Java and trusted Gradle caching for CI jobs

inputs:
  use-external-cache:
    description: Whether the caller manages CI cache restore and save
    required: false
    default: "false"
  enable-kvm:
    description: Whether to enable KVM on Linux
    required: false
    default: "false"

outputs:
  cache-enabled:
    description: Whether this event may restore trusted Gradle state
    value: ${{ steps.cache_policy.outputs.enabled }}
  cache-read-only:
    description: Whether this event may only read trusted Gradle state
    value: ${{ steps.cache_policy.outputs.read_only }}

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        java-version: "21"
        distribution: temurin

    - name: Resolve Gradle cache policy and options
      id: cache_policy
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        REPOSITORY: ${{ github.repository }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        USE_EXTERNAL_CACHE: ${{ inputs.use-external-cache }}
      run: bash "$GITHUB_ACTION_PATH/cache-policy.sh"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      with:
        # Refresh job state per commit and deduplicate shared artifacts.
        # Dedicated caches disable this provider through the shared policy.
        cache-provider: enhanced
        cache-disabled: ${{ steps.cache_policy.outputs.setup_gradle_disabled }}
        cache-read-only: ${{ steps.cache_policy.outputs.read_only == 'true' }}

    - name: Enable KVM
      if: ${{ inputs.enable-kvm == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
