name: Check whether the merge queue already tested this commit
description: Skip duplicate develop push tests while retaining the cache build; API failures run all tests
outputs:
  skip-tests:
    description: Whether this workflow already passed merge_group for this exact develop SHA
    value: ${{ steps.check.outputs.skip-tests }}
runs:
  using: composite
  steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        CHECK_SCRIPT: ${{ github.action_path }}/check.cjs
      with:
        script: |
          const {check} = require(process.env.CHECK_SCRIPT);
          core.setOutput('skip-tests', String(await check()));
