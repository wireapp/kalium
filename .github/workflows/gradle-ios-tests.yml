name: "iOS Tests"

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [ opened, synchronize ] # Don't rerun on `edited` to save time
  push:
    branches:
      - develop

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
    cancel-in-progress: true

permissions:
  contents: read # required for actions/checkout and repository metadata reads

jobs:
  detekt:
    name: Detekt
    uses: ./.github/workflows/codestyle.yml
  gradle-run-tests:
    name: Gradle Run Tests
    needs: [detekt]
    permissions:
      contents: read # required to read repository metadata in private repositories
      issues: read # required to find related pull requests in private repositories
      checks: write # required to publish unit test check runs
      pull-requests: write # required to publish pull request comments
    runs-on: macos-26
    env:
      # Leave room for the simulator and native linker on the free 7 GB runner.
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Fetch develop for affected module detection
        run: git fetch --no-tags --depth=1 origin develop:refs/remotes/origin/develop

      - name: Setup Java and Gradle
        id: setup-gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          use-external-cache: "true"

      - name: Restore iOS Gradle build cache
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        id: gradle-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Separate native test outputs from faster macOS jobs. Each commit can save
          # new outputs, while fallback restores retain reusable work after build edits.
          key: gradle-ios-macos26-${{ runner.arch }}-jdk21-v1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml', 'gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-ios-macos26-${{ runner.arch }}-jdk21-v1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml', 'gradle.properties') }}-
            gradle-ios-macos26-${{ runner.arch }}-jdk21-v1-

      - name: Boot iOS simulator
        run: python3 scripts/boot-ios-simulator.py

      - name: Restore Kotlin/Native tooling cache (.konan)
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        id: konan-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: iOS Tests
        id: ios-tests
        # Develop runs the complete suite to populate task outputs for future PRs.
        # PR and merge-queue runs keep using affected-module detection.
        run: |
          mkdir -p build/ci
          (
            while true; do
              date -u
              sysctl vm.swapusage
              vm_stat
              sleep 60
            done
          ) > build/ci/ios-runner-memory.log 2>&1 &
          memory_monitor_pid=$!
          trap 'kill "$memory_monitor_pid" 2>/dev/null || true' EXIT

          gradle_args=(--console=plain -Dorg.gradle.logging.level=lifecycle --profile)
          if [[ "$RUN_ALL_TESTS" == "true" ]]; then
            ./gradlew "${gradle_args[@]}" iosSimulatorArm64Test
          else
            # Finish selection before starting tests, so one Gradle daemon can be reused.
            ./gradlew "${gradle_args[@]}" iOSOnlyAffectedTest --list-only
            test_tasks=()
            while IFS= read -r task; do
              [[ -z "$task" ]] || test_tasks+=("$task")
            done < build/affected-tests/iOSOnlyAffectedTest.txt
            if (( ${#test_tasks[@]} > 0 )); then
              ./gradlew "${gradle_args[@]}" "${test_tasks[@]}"
            fi
          fi
        env:
          RUN_ALL_TESTS: ${{ github.event_name == 'push' }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record runner memory and disk use
        if: always()
        run: |
          sysctl hw.memsize vm.swapusage
          vm_stat
          df -h
          ps -axo pid,ppid,%cpu,rss,comm | sort -k4 -nr | head -20 || true

      - name: Archive build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-build-timings
          path: |
            build/reports/profile/**
            build/affected-tests/**
            build/ci/ios-runner-memory.log

      - name: Generate aggregated iOS test report
        if: ${{ always() && steps.ios-tests.outcome != 'skipped' }}
        run: ./gradlew aggregateIosSimulatorArm64TestReport

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
            name: test-reports
            path: |
              build/reports/tests/iosSimulatorArm64Test/**
              ./**/build/reports/tests/**

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
            name: test-results
            path: |
              ./**/build/test-results/testDebugUnitTest/**/*.xml
              ./**/build/test-results/**/*.xml
              ./**/build/test-results/iosSimulatorArm64Test/**

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action/macos@c950f6fb443cb5af20a377fd0dfaa78838901040
        if: ${{ always() }}
        with:
          files: |
            **/build/test-results/testDebugUnitTest/**/*.xml
            **/build/test-results/**/*.xml

      - name: Cleanup Gradle Cache
        # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
        # Restoring these files from a GitHub Actions cache might cause problems for future builds.
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

      - name: Save iOS Gradle build cache
        if: ${{ always() && steps.setup-gradle.outputs.cache-enabled == 'true' && steps.setup-gradle.outputs.cache-read-only != 'true' && steps.gradle-cache.outcome == 'success' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Kotlin/Native tooling cache (.konan)
        if: ${{ always() && steps.setup-gradle.outputs.cache-enabled == 'true' && steps.setup-gradle.outputs.cache-read-only != 'true' && steps.konan-cache.outcome == 'success' && steps.konan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

  upload-test-results-datadadog:
    name: Upload Test Results Datadadog
    runs-on: ubuntu-latest
    needs: gradle-run-tests
    if: always()

    steps:
      - name: Download tests results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
            name: test-results
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0
      - name: Install datadog-ci
        run: npm install -g @datadog/datadog-ci
      - name: "Upload results"
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ci
          DATADOG_SITE: datadoghq.eu
        run: |
          find . -name "*.xml" -type f | sed 's/ /\\ /g' | tr '\n' ' ' | xargs -L 1 datadog-ci junit upload --service kalium-ios .
