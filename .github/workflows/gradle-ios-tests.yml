name: "iOS Tests"

on:
  workflow_dispatch:
    inputs:
      swift_receiving_only:
        description: Run only the real Swift receiving verifier on this CI host
        type: boolean
        required: false
        default: false
  merge_group:
  pull_request:
    types: [ opened, synchronize ] # Don't rerun on `edited` to save time
  push:
    branches:
      - develop

concurrency:
    # Preserve existing groups; isolate the optional verifier from ordinary runs.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}${{ github.event_name == 'workflow_dispatch' && inputs.swift_receiving_only && format('-swift-receiving-{0}', github.ref) || '' }}
    cancel-in-progress: true

permissions:
  contents: read # required for actions/checkout and repository metadata reads

jobs:
  detekt:
    name: Detekt
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.swift_receiving_only) }}
    uses: ./.github/workflows/codestyle.yml
  gradle-run-tests:
    name: Gradle Run Tests
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.swift_receiving_only) }}
    needs: [detekt]
    permissions:
      contents: read # required to read repository metadata in private repositories
      issues: read # required to find related pull requests in private repositories
      checks: write # required to publish unit test check runs
      pull-requests: write # required to publish pull request comments
    runs-on: macos-26
    env:
      # Leave room for the native linker on the free 7 GB runner.
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Fetch develop for affected module detection
        run: git fetch --no-tags --depth=1 origin develop:refs/remotes/origin/develop

      - name: Setup Java and Gradle
        id: setup-gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          use-external-cache: "true"

      - name: Restore iOS Gradle build cache
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        id: gradle-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Separate native test outputs from faster macOS jobs. Each develop commit saves
          # new outputs, while fallback restores retain reusable work after build edits.
          key: gradle-ios-macos26-${{ runner.arch }}-jdk21-v1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml', 'gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-ios-macos26-${{ runner.arch }}-jdk21-v1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml', 'gradle.properties') }}-
            gradle-ios-macos26-${{ runner.arch }}-jdk21-v1-

      - name: Restore Kotlin/Native tooling cache (.konan)
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        id: konan-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Record runner memory in the background
        run: |
          mkdir -p build/ci
          # The runner stops this process when the job ends.
          nohup bash -c 'while true; do date -u; sysctl vm.swapusage; vm_stat; sleep 60; done' \
            > build/ci/ios-runner-memory.log 2>&1 &

      - name: Build iOS test binaries
        id: build-tests
        # Develop runs the complete suite to populate task outputs for future PRs.
        # PR and merge-queue runs keep using affected-module detection.
        # Link before booting the simulator: together they exceed the runner's memory and swap for hours.
        run: |
          gradle_args=(--console=plain -Dorg.gradle.logging.level=lifecycle --profile)
          if [[ "$RUN_ALL_TESTS" == "true" ]]; then
            echo iosSimulatorArm64Test > build/ci/ios-test-tasks.txt
          else
            # Finish selection before building, so one Gradle daemon can be reused.
            ./gradlew "${gradle_args[@]}" iOSOnlyAffectedTest --list-only
            cp build/affected-tests/iOSOnlyAffectedTest.txt build/ci/ios-test-tasks.txt
          fi

          link_tasks=()
          while IFS= read -r task; do
            [[ -z "$task" ]] || link_tasks+=("${task%iosSimulatorArm64Test}linkDebugTestIosSimulatorArm64")
          done < build/ci/ios-test-tasks.txt
          if (( ${#link_tasks[@]} > 0 )); then
            ./gradlew "${gradle_args[@]}" "${link_tasks[@]}"
            echo "has-tests=true" >> "$GITHUB_OUTPUT"
          fi
          # Release the daemon heap for the simulator. The test run only executes the linked binaries.
          ./gradlew --stop
        env:
          RUN_ALL_TESTS: ${{ github.event_name == 'push' }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot iOS simulator
        if: steps.build-tests.outputs.has-tests == 'true'
        run: python3 scripts/boot-ios-simulator.py

      - name: Install X.509 fixture dependencies
        if: steps.build-tests.outputs.has-tests == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/ios-tests-venv"
          "$RUNNER_TEMP/ios-tests-venv/bin/pip" install --quiet -r nse/scripts/requirements-ios-tests.txt

      - name: iOS Tests
        id: ios-tests
        if: steps.build-tests.outputs.has-tests == 'true'
        run: |
          test_tasks=()
          while IFS= read -r task; do
            [[ -z "$task" ]] || test_tasks+=("$task")
          done < build/ci/ios-test-tasks.txt
          # Receiving's X.509 tests call a local test CA that the booted simulator must trust.
          "$RUNNER_TEMP/ios-tests-venv/bin/python" nse/scripts/with-x509-fixture.py "$KALIUM_IOS_SIMULATOR_UDID" \
            ./gradlew --console=plain -Dorg.gradle.logging.level=lifecycle --profile "${test_tasks[@]}"
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record runner memory and disk use
        if: always()
        run: |
          sysctl hw.memsize vm.swapusage
          vm_stat
          df -h
          ps -axo pid,ppid,%cpu,rss,comm | sort -k4 -nr | head -20 || true

      - name: Archive build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-build-timings
          path: |
            build/reports/profile/**
            build/affected-tests/**
            build/ci/ios-runner-memory.log

      - name: Generate aggregated iOS test report
        if: ${{ always() && steps.ios-tests.outcome != 'skipped' }}
        run: ./gradlew aggregateIosSimulatorArm64TestReport

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
            name: test-reports
            path: |
              build/reports/tests/iosSimulatorArm64Test/**
              ./**/build/reports/tests/**

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
            name: test-results
            path: |
              ./**/build/test-results/testDebugUnitTest/**/*.xml
              ./**/build/test-results/**/*.xml
              ./**/build/test-results/iosSimulatorArm64Test/**

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action/macos@c950f6fb443cb5af20a377fd0dfaa78838901040
        if: ${{ always() }}
        with:
          files: |
            **/build/test-results/testDebugUnitTest/**/*.xml
            **/build/test-results/**/*.xml

      - name: Cleanup Gradle Cache
        # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
        # Restoring these files from a GitHub Actions cache might cause problems for future builds.
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

      - name: Save iOS Gradle build cache
        # Only develop saves: each entry is about 2 GB, and PR entries evicted the shared caches.
        if: ${{ always() && github.event_name == 'push' && steps.setup-gradle.outputs.cache-enabled == 'true' && steps.setup-gradle.outputs.cache-read-only != 'true' && steps.gradle-cache.outcome == 'success' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Kotlin/Native tooling cache (.konan)
        if: ${{ always() && steps.setup-gradle.outputs.cache-enabled == 'true' && steps.setup-gradle.outputs.cache-read-only != 'true' && steps.konan-cache.outcome == 'success' && steps.konan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

  upload-test-results-datadadog:
    name: Upload Test Results Datadadog
    runs-on: ubuntu-latest
    needs: gradle-run-tests
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.swift_receiving_only) }}

    steps:
      - name: Download tests results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
            name: test-results
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0
      - name: Install datadog-ci
        run: npm install -g @datadog/datadog-ci
      - name: "Upload results"
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ci
          DATADOG_SITE: datadoghq.eu
        run: |
          # xargs splits the report paths into batches that fit the argument limit.
          find . -name "*.xml" -type f -print0 | xargs -0 -r datadog-ci junit upload --service kalium-ios

  swift-receiving:
    name: Swift Receiving Only
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.swift_receiving_only }}
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Serialize native links and leave room for the linker on the 7 GB runner.
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Link Swift receiving framework and fixtures
        id: link
        timeout-minutes: 90
        run: |
          mkdir -p build/ci/swift-receiving
          # Stop even after a failed link; the verifier boots its own simulator later.
          trap './gradlew --stop >> build/ci/swift-receiving/link.log 2>&1 || true' EXIT
          ./gradlew --console=plain -Dorg.gradle.logging.level=lifecycle --profile \
            --no-parallel --max-workers=2 \
            :nse:linkDebugFrameworkIosSimulatorArm64 \
            :nse:generateAvsXcodeConfig \
            :domain:messaging:receiving:linkSwiftFixtureDebugExecutableIosSimulatorArm64 \
            :logic:linkSwiftAppFixtureDebugExecutableIosSimulatorArm64 \
            2>&1 | tee build/ci/swift-receiving/link.log
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verifier dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/swift-receiving-venv"
          "$RUNNER_TEMP/swift-receiving-venv/bin/pip" install --quiet \
            -r nse/scripts/requirements-ios-tests.txt \
            2>&1 | tee build/ci/swift-receiving/dependencies.log

      - name: Verify real Swift receiving through the loopback relay
        id: verify
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if [[ "$(id -u)" == 0 ]]; then
            echo '::error::The verifier and simulator must run as the regular runner user'
            exit 1
          fi
          log_dir="$GITHUB_WORKSPACE/build/ci/swift-receiving"
          relay_pid_file="$RUNNER_TEMP/swift-receiving-relay-$$.pid"
          relay_launcher_pid=''
          cleanup() {
            result=$?
            trap - EXIT
            if [[ -s "$relay_pid_file" ]]; then
              read -r relay_pid < "$relay_pid_file"
              if [[ "$relay_pid" =~ ^[0-9]+$ ]]; then
                sudo -n /bin/kill -TERM "$relay_pid" 2>/dev/null || true
              fi
            fi
            if [[ -n "$relay_launcher_pid" ]]; then
              # Also cover an interruption while sudo is still starting the relay.
              kill "$relay_launcher_pid" 2>/dev/null || true
              wait "$relay_launcher_pid" 2>/dev/null || true
            fi
            rm -f "$relay_pid_file" || true
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          relay_python="$(command -v python3)"
          # Only this stdlib TCP relay is root. It never terminates TLS or handles HTTP.
          sudo -n /bin/sh -c 'echo "$$" > "$1"; exec "$2" -I -u "$3" --listen-port 443 --upstream-port 8443' \
            swift-receiving-relay "$relay_pid_file" "$relay_python" \
            "$GITHUB_WORKSPACE/nse/scripts/local-wss-relay.py" \
            > "$log_dir/relay.log" 2>&1 &
          relay_launcher_pid=$!
          relay_ready=false
          for attempt in {1..100}; do
            if grep -q '^Loopback TCP relay 127.0.0.1:443 -> 127.0.0.1:8443;' "$log_dir/relay.log"; then
              relay_ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$relay_ready" != true ]]; then
            echo '::error::Loopback relay did not bind port 443; see relay.log'
            exit 1
          fi
          "$RUNNER_TEMP/swift-receiving-venv/bin/python" -u \
            nse/scripts/verify-swift-receiving-relayed.py --skip-build \
            2>&1 | tee "$log_dir/verifier.log"

      - name: Record verifier outcome and runner diagnostics
        if: always()
        env:
          LINK_OUTCOME: ${{ steps.link.outcome }}
          VERIFIER_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p build/ci/swift-receiving
          {
            printf 'commit=%s\nlink=%s\nverifier=%s\n' "$GITHUB_SHA" "$LINK_OUTCOME" "$VERIFIER_OUTCOME"
            xcodebuild -version
            xcrun simctl list runtimes
            sysctl hw.memsize vm.swapusage
            vm_stat
            df -h
          } > build/ci/swift-receiving/runner.log 2>&1

      - name: Archive Swift receiving reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-receiving-verification
          retention-days: 7
          path: |
            nse/build/reports/swift-receiving/**
            build/ci/swift-receiving/**
            build/reports/profile/**
