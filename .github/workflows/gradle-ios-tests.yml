name: "iOS Tests"

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [ opened, synchronize ] # Don't rerun on `edited` to save time
  push:
    branches:
      - develop

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
    cancel-in-progress: true

permissions:
  contents: read # required for actions/checkout and repository metadata reads

jobs:
  detekt:
    name: Detekt
    uses: ./.github/workflows/codestyle.yml

  test-selection:
    name: Validate iOS task selection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          # This small verification job must not write another Gradle-home cache.
          use-external-cache: "true"
      - name: Test affected-module selection and shard coverage
        run: ./gradlew -p buildSrc test --tests DagCommandTaskTest --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g -XX:+UseParallelGC"

  ios-tests:
    name: iOS Tests (${{ matrix.shard }})
    needs: [detekt, test-selection]
    strategy:
      fail-fast: false
      matrix:
        shard: [logic, data, receiving, extensions]
    permissions:
      contents: read # required to read repository metadata in private repositories
      issues: read # required to find related pull requests in private repositories
      checks: write # required to publish unit test check runs
      pull-requests: write # required to publish pull request comments
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Parallelize across runners, not competing native links on the same 7 GB Mac.
      GRADLE_OPTS: -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Fetch develop for affected module detection
        run: git fetch --no-tags --depth=1 origin develop:refs/remotes/origin/develop

      - name: Setup Java and Gradle
        id: setup-gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          use-external-cache: "true"

      - name: Record cache restore start
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        continue-on-error: true
        run: python3 .github/actions/gradle-cache-report/report.py restore-start

      - name: Restore shared iOS Gradle dependencies
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        id: gradle-dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/caches/build-cache-*
            ~/.gradle/wrapper
          # Share downloads and Gradle tooling, without duplicating them in every shard cache.
          key: gradle-ios-deps-macos26-${{ runner.arch }}-jdk21-v1-${{ hashFiles('**/*.gradle*', 'gradle/*.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-ios-deps-macos26-${{ runner.arch }}-jdk21-v1-

      - name: Restore iOS shard build outputs
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        id: gradle-outputs
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.gradle/caches/build-cache-*
          # Each shard owns its task outputs; concurrent saves must not race for one cache key.
          key: gradle-ios-outputs-macos26-${{ runner.arch }}-jdk21-v1-${{ matrix.shard }}-${{ hashFiles('**/*.gradle*', 'gradle/*.versions.toml', 'gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-ios-outputs-macos26-${{ runner.arch }}-jdk21-v1-${{ matrix.shard }}-${{ hashFiles('**/*.gradle*', 'gradle/*.versions.toml', 'gradle.properties') }}-
            gradle-ios-outputs-macos26-${{ runner.arch }}-jdk21-v1-${{ matrix.shard }}-

      - name: Restore Kotlin/Native tooling cache (.konan)
        if: steps.setup-gradle.outputs.cache-enabled == 'true'
        id: konan-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Record cache restore end
        if: ${{ always() && steps.setup-gradle.outputs.cache-enabled == 'true' }}
        continue-on-error: true
        run: python3 .github/actions/gradle-cache-report/report.py restore-end

      - name: Record runner memory in the background
        run: |
          mkdir -p build/ci
          # The runner stops this process when the job ends.
          nohup bash -c 'while true; do
            date -u
            sysctl vm.swapusage
            vm_stat
            ps -axo pid,ppid,%cpu,rss,comm | sort -k4 -nr | head -15
            sleep 60
          done' \
            > build/ci/ios-runner-memory.log 2>&1 &

      - name: Build iOS test binaries
        id: build-tests
        # Develop and manual runs select the full suite, partitioned into disjoint groups.
        # PR and merge-queue runs keep using affected-module detection.
        # Link before booting the simulator: together they exceed the runner's memory and swap for hours.
        run: |
          gradle_args=(--console=plain -Dorg.gradle.logging.level=lifecycle --profile)
          selection_args=("--ios-shard=$IOS_TEST_SHARD")
          if [[ "$RUN_ALL_TESTS" == "true" ]]; then
            selection_args+=(--all-modules)
          fi
          # Finish selection before building, so one Gradle daemon can be reused.
          ./gradlew "${gradle_args[@]}" iOSOnlyAffectedTest --list-only "${selection_args[@]}"
          cp build/affected-tests/iOSOnlyAffectedTest.txt build/ci/ios-test-tasks.txt

          link_tasks=()
          while IFS= read -r task; do
            [[ -z "$task" ]] || link_tasks+=("${task%iosSimulatorArm64Test}linkDebugTestIosSimulatorArm64")
          done < build/ci/ios-test-tasks.txt
          if (( ${#link_tasks[@]} > 0 )); then
            ./gradlew "${gradle_args[@]}" "${link_tasks[@]}"
            echo "has-tests=true" >> "$GITHUB_OUTPUT"
          fi
          # Release the daemon heap for the simulator. The test run only executes the linked binaries.
          ./gradlew --stop
        env:
          IOS_TEST_SHARD: ${{ matrix.shard }}
          RUN_ALL_TESTS: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot iOS simulator
        if: steps.build-tests.outputs.has-tests == 'true'
        run: python3 scripts/boot-ios-simulator.py

      - name: Install X.509 fixture dependencies
        if: steps.build-tests.outputs.has-tests == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/ios-tests-venv"
          "$RUNNER_TEMP/ios-tests-venv/bin/pip" install --quiet -r nse/scripts/requirements-ios-tests.txt

      - name: iOS Tests
        id: ios-tests
        if: steps.build-tests.outputs.has-tests == 'true'
        run: |
          test_tasks=()
          while IFS= read -r task; do
            [[ -z "$task" ]] || test_tasks+=("$task")
          done < build/ci/ios-test-tasks.txt
          # Receiving's X.509 tests call a local test CA that the booted simulator must trust.
          "$RUNNER_TEMP/ios-tests-venv/bin/python" nse/scripts/with-x509-fixture.py "$KALIUM_IOS_SIMULATOR_UDID" \
            ./gradlew --console=plain -Dorg.gradle.logging.level=lifecycle \
            -Dorg.gradle.jvmargs="-Xmx1g -XX:+UseParallelGC" --profile --continue "${test_tasks[@]}"
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record runner memory and disk use
        if: always()
        run: |
          sysctl hw.memsize vm.swapusage
          vm_stat
          df -h
          ps -axo pid,ppid,%cpu,rss,comm | sort -k4 -nr | head -20 || true

      - name: Generate aggregated iOS test report
        if: ${{ always() && (steps.ios-tests.outcome == 'success' || steps.ios-tests.outcome == 'failure') }}
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx1g -XX:+UseParallelGC" aggregateIosSimulatorArm64TestReport

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
            name: test-reports-ios-${{ matrix.shard }}
            path: |
              build/reports/tests/iosSimulatorArm64Test/**
              ./**/build/reports/tests/**

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
            name: test-results-ios-${{ matrix.shard }}
            path: |
              ./**/build/test-results/testDebugUnitTest/**/*.xml
              ./**/build/test-results/**/*.xml
              ./**/build/test-results/iosSimulatorArm64Test/**

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action/macos@c950f6fb443cb5af20a377fd0dfaa78838901040
        if: ${{ always() && steps.build-tests.outputs.has-tests == 'true' }}
        with:
          check_name: iOS Test Results (${{ matrix.shard }})
          action_fail_on_inconclusive: true
          # Native test logs can exceed the XML parser's default CDATA limit.
          large_files: true
          files: '**/build/test-results/iosSimulatorArm64Test/**/*.xml'

      - name: Stop Gradle and clean cache locks
        if: always()
        # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
        # Restoring these files from a GitHub Actions cache might cause problems for future builds.
        run: |
          ./gradlew --stop
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

      - name: Record cache save start
        if: ${{ always() && steps.setup-gradle.outputs.cache-enabled == 'true' }}
        continue-on-error: true
        run: python3 .github/actions/gradle-cache-report/report.py save-start

      - name: Save shared iOS Gradle dependencies
        id: save-gradle-dependencies
        # Logic has the broadest dependencies. Failed tests must not discard a successful build.
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.shard == 'logic' && steps.build-tests.outcome == 'success' && steps.setup-gradle.outputs.cache-enabled == 'true' && steps.setup-gradle.outputs.cache-read-only != 'true' && steps.gradle-dependencies.outcome == 'success' && steps.gradle-dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/caches/build-cache-*
            ~/.gradle/wrapper
          key: ${{ steps.gradle-dependencies.outputs.cache-primary-key }}

      - name: Save iOS shard build outputs
        id: save-gradle-outputs
        # The shared policy permits develop and same-repository PRs; merge queue is read-only.
        # PR merge-ref caches let later commits on that PR reuse outputs without seeding other PRs.
        if: ${{ always() && steps.build-tests.outcome == 'success' && steps.build-tests.outputs.has-tests == 'true' && steps.setup-gradle.outputs.cache-enabled == 'true' && steps.setup-gradle.outputs.cache-read-only != 'true' && steps.gradle-outputs.outcome == 'success' && steps.gradle-outputs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.gradle/caches/build-cache-*
          key: ${{ steps.gradle-outputs.outputs.cache-primary-key }}

      - name: Save Kotlin/Native tooling cache (.konan)
        id: save-konan
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.shard == 'logic' && steps.build-tests.outcome == 'success' && steps.setup-gradle.outputs.cache-enabled == 'true' && steps.setup-gradle.outputs.cache-read-only != 'true' && steps.konan-cache.outcome == 'success' && steps.konan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

      - name: Summarize cache effectiveness
        if: always()
        continue-on-error: true
        env:
          CACHE_REPORT_LABEL: iOS ${{ matrix.shard }}
          GRADLE_STAGES: |
            {"Build binaries": "${{ steps.build-tests.outcome }}", "Tests": "${{ steps.ios-tests.outcome }}"}
          CACHE_STATES: |
            {
              "dependencies": {"restore": ${{ toJSON(steps.gradle-dependencies) }}, "save": ${{ toJSON(steps.save-gradle-dependencies) }}},
              "outputs": {"restore": ${{ toJSON(steps.gradle-outputs) }}, "save": ${{ toJSON(steps.save-gradle-outputs) }}},
              "konan": {"restore": ${{ toJSON(steps.konan-cache) }}, "save": ${{ toJSON(steps.save-konan) }}}
            }
        run: python3 .github/actions/gradle-cache-report/report.py summary

      - name: Archive build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-build-timings-${{ matrix.shard }}
          path: |
            build/reports/profile/**
            build/affected-tests/**
            build/ci/ios-test-tasks.txt
            build/ci/ios-runner-memory.log
            build/ci/cache-report.json

  # Preserve the existing required check name while exposing each shard's result separately.
  gradle-run-tests:
    name: Gradle Run Tests
    runs-on: ubuntu-latest
    needs: ios-tests
    if: always()
    steps:
      - name: Check every iOS shard
        env:
          SHARD_RESULT: ${{ needs.ios-tests.result }}
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "::error::iOS test shards finished with result: $SHARD_RESULT"
            exit 1
          fi

  upload-test-results-datadadog:
    name: Upload Test Results Datadadog
    runs-on: ubuntu-latest
    needs: gradle-run-tests
    if: always()

    steps:
      - name: Download tests results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
            pattern: test-results-ios-*
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0
      - name: Install datadog-ci
        run: npm install -g @datadog/datadog-ci
      - name: "Upload results"
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ci
          DATADOG_SITE: datadoghq.eu
        run: |
          # xargs splits the report paths into batches that fit the argument limit.
          find . -name "*.xml" -type f -print0 | xargs -0 -r datadog-ci junit upload --service kalium-ios
