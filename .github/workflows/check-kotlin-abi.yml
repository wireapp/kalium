name: "Kotlin ABI"

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # required for actions/checkout and repository metadata reads

jobs:
  check-kotlin-abi:
    name: Check Kotlin ABI
    # Pull requests run on Linux, where the Apple klib dumps cannot be built. Merge queue and develop run the full check on macOS.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-15' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Check Kotlin ABI (JVM and Android dumps)
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::Apple klib ABI dump is not validated on pull requests (needs macOS). The merge queue runs the full check."
          # Turning cross-compilation off marks the Apple targets as unsupported on Linux. The check then validates
          # the JVM and Android dumps, and takes the Apple targets from the checked-in klib dump unverified.
          ./gradlew :logic:checkKotlinAbi -Pkotlin.native.enableKlibsCrossCompilation=false

      - name: Check Kotlin ABI
        if: github.event_name != 'pull_request'
        run: ./gradlew :logic:checkKotlinAbi
