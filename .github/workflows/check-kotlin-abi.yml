name: "Kotlin ABI"

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # required for actions/checkout and repository metadata reads

jobs:
  check-kotlin-abi:
    name: Check Kotlin ABI
    # Pull requests run on Linux, where the Apple klib dumps cannot be built. Merge queue and develop run the full check on macOS.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-15' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Check Kotlin ABI (JVM and Android dumps)
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::Apple klib ABI dump is not validated on pull requests (needs macOS). The merge queue runs the full check."
          # On Linux the Apple targets are unsupported, and checkKotlinAbi would fail on the inferred klib dump.
          # Regenerate the dumps and compare only the JVM and Android ones with the checked-in files.
          ./gradlew :logic:updateKotlinAbi -Pkotlin.native.enableKlibsCrossCompilation=false
          if ! git diff --exit-code -- logic/api/jvm logic/api/android; then
            echo "::error::The public JVM or Android API of logic changed. Run ./gradlew :logic:updateKotlinAbi on macOS and commit the dumps."
            exit 1
          fi

      - name: Check Kotlin ABI
        if: github.event_name != 'pull_request'
        run: ./gradlew :logic:checkKotlinAbi
