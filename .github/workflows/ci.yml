name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Run Detekt
        run: ./gradlew detekt

  jvm-tests:
    name: JVM tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kubazwire/cryptobox:1.0.0@sha256:4791e83cd7c76418e623c5ba17e9396efacf4f742d960a340eb08a106263334b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Run JVM tests
        run: ./gradlew jvmTest --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" -Djava.library.path="$LD_LIBRARY_PATH"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jvm-test-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  database-migrations:
    name: Database migrations
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Verify database migrations
        run: ./gradlew :data:persistence:jvmTest --tests com.wire.kalium.persistence.migrations.VerifyDatabaseMigrationsTest --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Upload schema dumps on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-migration-artifacts-${{ github.run_attempt }}
          path: "**/build/*schema-dumps/**/*.json"
          if-no-files-found: ignore
          retention-days: 7

  android-unit-tests:
    name: Android unit tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Run Android unit tests
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew testAndroidHostTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unit-test-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  ios-tests:
    name: iOS tests
    needs: static-analysis
    runs-on: [self-hosted, macOS, ARM64, wire-nirvana]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Report Xcode and simulator inventory
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes --json
          xcrun simctl list devicetypes --json

      - name: Run iOS simulator tests
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/kalium-ios-tests"
          "$RUNNER_TEMP/kalium-ios-tests/bin/pip" install -r nse/scripts/requirements-ios-tests.txt
          "$RUNNER_TEMP/kalium-ios-tests/bin/python" nse/scripts/run-ios-tests.py --continue

      # Modules with macOS-only code. The rest of the receiving suite runs on the simulator only:
      # its X.509 tests need the fixture certificate that run-ios-tests.py trusts there.
      - name: Run macOS tests
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./gradlew --continue
          :core:logger:macosArm64Test
          :logic:macosArm64Test
          :share:macosArm64Test
          :domain:messaging:receiving:macosArm64Test --tests com.wire.kalium.logic.sync.receiving.AppleAccountRuntimeOwnerTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-test-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  android-instrumented-tests:
    name: Android instrumented tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      - name: Set up Java, Gradle, and KVM
        uses: ./.github/actions/setup-java-gradle
        with:
          enable-kvm: true

      # Build before starting QEMU so Kotlin/D8 do not compete with the emulator.
      - name: Build Android test APKs
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew assembleAndroidDeviceTest --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC" -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew --stop

      - name: Resolve emulator configuration
        id: avd-info
        uses: ./.github/actions/get-avd-info
        with:
          api-level: 31

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          api-level: 31
          arch: ${{ steps.avd-info.outputs.arch }}
          target: ${{ steps.avd-info.outputs.target }}
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: ./gradlew ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'connectedAndroidOnlyAffectedTest' || 'connectedAndroidDeviceTest' }} --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC" -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-instrumented-test-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/**
            **/build/reports/androidTests/**
            **/build/test-results/**/*.xml
            **/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
