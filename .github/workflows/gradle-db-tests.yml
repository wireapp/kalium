name: "Database Tests"

on:
  merge_group:
  pull_request:
    types: [ opened, synchronize ] # Don't rerun on `edited` to save time
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || format('push-{0}', github.sha) }}
  cancel-in-progress: true

permissions:
  actions: read # required to find successful merge-queue runs
  contents: read # required for actions/checkout and repository metadata reads

jobs:
  gradle-run-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx6G -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Check merge-queue test result
        id: tested-merge
        uses: ./.github/actions/skip-tested-merge

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Warm develop cache without running tests
        if: steps.tested-merge.outputs.skip-tests == 'true'
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :data:persistence:jvmTestClasses

      # Probably redundant since this is part of the test suite, leaving as a separate step for clarity and artifacting purposes.
      - name: Verify DB Migrations
        if: steps.tested-merge.outputs.skip-tests != 'true'
        run: |
          ./gradlew :data:persistence:jvmTest --tests com.wire.kalium.persistence.migrations.VerifyDatabaseMigrationsTest

      - name: Archive DB test artifacts
        if: ${{ always() && steps.tested-merge.outputs.skip-tests != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db-test-artifacts
          path: |
            ./**/build/*schema-dumps/**/*.json

      - name: Cleanup Gradle Cache
        # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
        # Restoring these files from a GitHub Actions cache might cause problems for future builds.
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
